{% extends 'base.html' %}{% block content %}<div class="panel"><h1>پشتیبانی</h1><form method="post">{% csrf_token %}<input name="subject" placeholder="موضوع" required><textarea name="body" placeholder="شرح مشکل" required></textarea><button class="btn">ثبت تیکت</button></form><hr>{% for t in tickets %}<div class="notification"><b>{{t.subject}}</b><span class="badge">{{t.get_status_display}}</span><p>{{t.body}}</p></div>{% endfor %}</div>{% endblock %}
