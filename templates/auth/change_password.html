{% extends 'base.html' %}
{% block title %}تغییر رمز عبور | دانا{% endblock %}
{% block content %}
<div class="panel auth-panel">
<h1>تغییر رمز عبور</h1>
<p class="muted">رمز جدید باید حداقل ۸ کاراکتر باشد.</p>
<form method="post">{% csrf_token %}
<input type="password" name="current_password" placeholder="رمز عبور فعلی">
<input type="password" name="new_password" placeholder="رمز عبور جدید" required>
<input type="password" name="confirm_password" placeholder="تکرار رمز عبور جدید" required>
<button class="btn">ذخیره رمز جدید</button>
</form>
<a href="/profile/">بازگشت به پروفایل</a>
</div>
{% endblock %}
