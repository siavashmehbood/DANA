name: Create Production Admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-admin:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DANA_ARTICLE_DATABASE_URL }}
      DANA_ARTICLE_DATABASE_URL: ${{ secrets.DANA_ARTICLE_DATABASE_URL }}
      DANA_ADMIN_PASSWORD: ${{ secrets.DANA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dana-2.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create or update production superuser
        shell: bash
        run: |
          test -n "$DANA_ARTICLE_DATABASE_URL"
          test -n "$DANA_ADMIN_PASSWORD"
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          username = "siavashmehboodi"
          user, created = User.objects.get_or_create(username=username)
          user.is_staff = True
          user.is_superuser = True
          user.is_active = True
          user.set_password(os.environ["DANA_ADMIN_PASSWORD"])
          user.save()
          print("Production admin configured:", username, "created=" + str(created))
          PY
