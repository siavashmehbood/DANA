name: DANA CI
on:
  push:
    branches: [main, dana-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Argos real en-to-fa smoke
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_CHUNK_TYPE: MINISBD
        run: |
          python - <<'PY'
          import django
          django.setup()
          from articles.translation import _argos_translate, _translation_quality
          source = 'Artificial intelligence improves scientific research.'
          translated = _argos_translate(source)
          print('Argos en->fa:', translated)
          assert translated and _translation_quality(source, translated), translated
          PY
      - name: Django check
        run: python manage.py check
      - name: Migration check
        run: python manage.py makemigrations --check
      - name: Tests
        run: python manage.py test
      - name: Deployment security check
        env:
          DEBUG: '0'
          SECRET_KEY: 'ci-only-random-secret-key-012345678901234567890123456789'
          ALLOWED_HOSTS: 'localhost'
          CSRF_TRUSTED_ORIGINS: 'https://localhost'
        run: python manage.py check --deploy

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dana_ci
          POSTGRES_USER: dana
          POSTGRES_PASSWORD: dana_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dana -d dana_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: postgresql
      DB_NAME: dana_ci
      DB_USER: dana
      DB_PASSWORD: dana_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_CONN_MAX_AGE: '0'
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Migration check
        run: python manage.py makemigrations --check
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: PostgreSQL regression suite
        run: python manage.py test


  deploy-staging:
    needs: [test, postgres]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dana-2.0' }}
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy when hook is configured
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured; relying on Render native auto-deploy."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$RENDER_DEPLOY_HOOK_URL" >/dev/null
          echo "Render deploy hook accepted."

  browser-production:
    needs: [test, postgres, deploy-staging]
    if: ${{ always() && needs.test.result == 'success' && needs.postgres.result == 'success' && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') && (github.event_name == 'push' && github.ref == 'refs/heads/dana-2.0') }}
    concurrency:
      group: browser-production-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
      - name: Wait for exact staging commit and manifest-versioned assets
        env:
          DANA_E2E_BASE_URL: https://dana-staging-web.onrender.com
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,re,time,urllib.request
          base='https://dana-staging-web.onrender.com'
          url=base+'/'
          ready_url=base+'/readyz/'
          expected_sha=os.environ['EXPECTED_DEPLOY_SHA']
          expected=re.compile(r'/static/css/app\.[0-9a-f]{12}\.css')
          for attempt in range(45):
              try:
                  ready_req=urllib.request.Request(
                      ready_url,
                      headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'DANA-CI-deploy-readiness'},
                  )
                  ready=json.loads(urllib.request.urlopen(ready_req,timeout=30).read().decode('utf-8'))
                  deployed_sha=ready.get('release','')
                  if deployed_sha != expected_sha:
                      print('waiting for exact staging commit',attempt+1,'deployed=',deployed_sha[:12] or '<unknown>','expected=',expected_sha[:12])
                      time.sleep(20)
                      continue
                  req=urllib.request.Request(
                      url,
                      headers={
                          'Cache-Control':'no-cache',
                          'Pragma':'no-cache',
                          'User-Agent':'DANA-CI-deploy-readiness',
                      },
                  )
                  html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
                  match=expected.search(html)
                  if match:
                      asset=match.group(0)
                      asset_req=urllib.request.Request(
                          base+asset,
                          headers={'Cache-Control':'no-cache','User-Agent':'DANA-CI-deploy-readiness'},
                      )
                      response=urllib.request.urlopen(asset_req,timeout=30)
                      if response.status == 200:
                          print('staging manifest asset is live:',asset)
                          break
                  print('waiting for staging manifest asset',attempt+1)
              except Exception as exc:
                  print('staging probe failed',repr(exc))
              time.sleep(20)
          else:
              raise SystemExit('staging did not expose the exact expected commit with a live WhiteNoise manifest asset in time')
          PY
      - name: Real browser mobile acceptance
        env:
          DANA_E2E_BASE_URL: https://dana-staging-web.onrender.com
        run: python e2e/test_mobile_production.py
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-production-screenshots
          path: artifacts/mobile/
          if-no-files-found: warn
